name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Yaegi plugins have broken on Traefik PATCH releases without any change on our
  # side, so the compatibility matrix runs on a schedule too. Finding out from a
  # scheduled run beats finding out from a user.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Must match the go directive in go.mod. Traefik interprets this plugin
          # with Yaegi (v0.16.3 in v3.8.0), which exposes only the Go 1.22 standard library —
          # building with a newer toolchain would happily accept APIs that fail at
          # plugin load time.
          go-version: "1.22"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"; echo "$unformatted"; exit 1
          fi
      - name: the Traefik pin is one version everywhere
        run: |
          # The pin lives in the compose file, the e2e overlay, and in this
          # workflow (the matrix, the sed, the render-check steps' `if:`). A
          # compose bump that forgot the matrix quietly weakened the integration job.
          pin=$(sed -nE 's/^ *image: traefik:(v[0-9.]+)$/\1/p' examples/docker-compose.yml | head -1)
          echo "compose pin: $pin"
          test -n "$pin"
          test "$(grep -c "image: traefik:$pin" examples/docker-compose.e2e.yml)" -eq 2
          grep -qF "traefik: [\"$pin\"," .github/workflows/ci.yml
          grep -qF "image: traefik:$pin|" .github/workflows/ci.yml
          test "$(grep -cF "matrix.traefik == '$pin'" .github/workflows/ci.yml)" -eq 3

  yaegi:
    name: interpreter smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Yaegi resolves the plugin from a GOPATH source tree, so it has to live
          # at the import path Traefik would use.
          path: go/src/github.com/phoen-ix/scanguard
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22"
      - name: run the plugin under Yaegi
        working-directory: go/src/github.com/phoen-ix/scanguard/tools/yaegi-smoke
        env:
          SMOKE_GOPATH: ${{ github.workspace }}/go
          # Wait one janitor tick out (about 35s): the sweep, the expiry claim
          # and the expiry notification run under the interpreter nowhere else.
          SMOKE_JANITOR: "1"
        run: go run .

  dependencies:
    name: no third-party dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the plugin module must stay dependency-free
        run: |
          # Every dependency has to be vendored for the plugin catalog AND has to
          # survive interpretation. Anything using cgo, assembly, //go:embed or
          # heavy reflection fails at plugin import, so the safe number is zero.
          if grep -qE '^\s*require' go.mod; then
            echo "go.mod has grown a dependency:"; cat go.mod; exit 1
          fi

  # The console e2e suite (e2e/tests/, e2e/COVERAGE.md) against the examples/
  # harness on the pinned Traefik. scripts/e2e.sh starts and removes its own
  # harness, so this is a job of its own rather than a step in `integration`.
  e2e:
    name: console e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: install Playwright
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: typecheck and lint the suite (no floating promises)
        working-directory: e2e
        run: npm run typecheck && npm run lint
      - name: console e2e suite
        run: ARTIFACTS="$RUNNER_TEMP/e2e-run" scripts/e2e.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-run
          path: ${{ runner.temp }}/e2e-run/
          retention-days: 7

  integration:
    name: traefik ${{ matrix.traefik }}
    runs-on: ubuntu-latest
    env:
      # Always an explicit compose project name (CLAUDE.md): a bare `docker
      # compose` names the project after the directory, "examples".
      COMPOSE_PROJECT_NAME: scanguard_e2e
    strategy:
      fail-fast: false
      matrix:
        traefik: ["v3.8.0", "v3.8", "v3.7"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: start the harness
        working-directory: examples
        run: |
          sed -i "s|image: traefik:v3.8.0|image: traefik:${{ matrix.traefik }}|" docker-compose.yml
          docker compose up -d
          for i in $(seq 1 30); do
            curl -sf http://localhost:18081/api/overview >/dev/null && break
            sleep 2
          done

      - name: the plugin must actually have loaded
        working-directory: examples
        run: |
          # A plugin that failed to load shows up as "invalid middleware type or
          # middleware does not exist", and routes using it silently 404 — which
          # is exactly how this breaks on a Traefik upgrade.
          #
          # The log goes to a file first. `docker compose logs | grep -q` under
          # the runner's `bash -eo pipefail` fails whenever grep MATCHES: grep
          # exits at the first hit, docker gets SIGPIPE, the pipeline is non-zero,
          # so a found warning passed this gate and a found "initialised" failed it.
          docker compose logs traefik > "$RUNNER_TEMP/traefik.log" 2>&1
          if grep -qiE 'invalid middleware type|middleware does not exist|plugin.*error' "$RUNNER_TEMP/traefik.log"; then
            cat "$RUNNER_TEMP/traefik.log"; exit 1
          fi
          grep -q 'scanguard initialised' "$RUNNER_TEMP/traefik.log"

      - name: detection and enforcement
        working-directory: examples
        run: ./scanner-sim.sh

      # The docs tour (e2e/docs/) as a render check of the console, while
      # scanner-sim.sh's bans are there to render. Once, on the pinned Traefik.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.traefik == 'v3.8.0'
        with:
          node-version: "26"
      - name: console render check (docs tour)
        if: matrix.traefik == 'v3.8.0'
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          DOCS_SCREENSHOT_DIR="$RUNNER_TEMP/screenshots" \
            npx playwright test -c playwright.docs.config.ts --output "$RUNNER_TEMP/docs-run"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && matrix.traefik == 'v3.8.0'
        with:
          name: docs-run
          path: ${{ runner.temp }}/docs-run/
          retention-days: 7

      - name: streaming gate (websocket + sse)
        working-directory: examples
        run: ./streaming-check.sh

      - name: rule editor
        working-directory: examples
        run: ./rules-check.sh

      - name: notifications (outbound HTTP from interpreted goroutines)
        working-directory: examples
        run: ./notify-check.sh

      - name: bans survive a restart
        working-directory: examples
        run: ./restart-check.sh

      - name: no degraded-streaming warnings
        working-directory: examples
        run: |
          docker compose logs traefik > "$RUNNER_TEMP/traefik.log" 2>&1
          if grep -qE 'flusher-unavailable|hijacker-unavailable' "$RUNNER_TEMP/traefik.log"; then
            echo "the ResponseWriter wrapper lost an interface on this Traefik version"
            grep -E 'flusher|hijacker' "$RUNNER_TEMP/traefik.log"
            exit 1
          fi

      - name: traefik logs
        if: failure()
        working-directory: examples
        run: docker compose logs traefik
